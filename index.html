<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <meta
      name="description"
      content="Osobista dokumentacja znamion skórnych. Aplikacja nie diagnozuje."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230f766e'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ccfbf1'/%3E%3C/svg%3E"
    />
    <title>Skin Tracker — dokumentacja znamion</title>
    <script>
      // Ustaw tryb ciemny zanim wyrenderuje się React (żeby uniknąć mignięcia).
      (function () {
        try {
          var saved = localStorage.getItem('skin-tracker:theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
