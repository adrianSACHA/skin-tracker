name: Testy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Testy jednostkowe (czyste funkcje) - szybkie, bez przegladarki.
      - name: Testy jednostkowe
        run: npm test

      - name: Instalacja przegladarki Chromium
        run: npx playwright install --with-deps chromium

      # Testy e2e nie potrzebuja sekretow: backend Supabase jest zamockowany,
      # a adres `https://e2e.invalid` pochodzi z e2e/support/constants.js.
      - name: Testy e2e
        run: npm run e2e

      - name: Raport z testow e2e (na wypadek bledu)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
