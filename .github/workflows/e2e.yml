name: Testy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: 'Wygeneruj wzorce zrzutow dla Linuksa (potem pobierz artefakt baseline-linux i zacommituj)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Testy jednostkowe (czyste funkcje) - szybkie, bez przegladarki.
      - name: Testy jednostkowe
        run: npm test

      - name: Instalacja przegladarki Chromium
        run: npx playwright install --with-deps chromium

      # Recznie uruchamiane generowanie wzorcow zrzutow dla Linuksa.
      # Bez nich testy wizualne na Linuksie pomijaja sie (brak punktu
      # odniesienia), a w CI brakujacy wzorzec jest BLEDEM - dlatego
      # generujemy je swiadomie i zacommitujemy z artefaktu.
      - name: Generowanie wzorcow zrzutow (Linux)
        if: ${{ inputs.update_visual_baselines }}
        run: npx playwright test visual --update-snapshots
        env:
          E2E_VISUAL_UPDATE: '1'

      # Testy e2e nie potrzebuja sekretow: backend Supabase jest zamockowany,
      # a adres `https://e2e.invalid` pochodzi z e2e/support/constants.js.
      - name: Testy e2e
        run: npm run e2e

      # Zrzuty ekranu maja baseline PER-PLATFORMA (Playwright dokleja do
      # nazwy pliku `process.platform`). Windowsowe leza w repo; linuxowe
      # powstaja w kroku „Generowanie wzorcow zrzutow” (workflow_dispatch) —
      # pobierz ten artefakt i zacommituj, zeby CI porownywalo z nimi.
      - name: Baseline zrzutow ekranu (Linux)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: baseline-linux
          path: e2e/visual/screens.spec.js-snapshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Raport z testow e2e (na wypadek bledu)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
